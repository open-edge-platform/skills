version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - ".agents/skills/**"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      github-actions-dependency:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - ".agents/skills/**"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      npm-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - ".agents/skills/**"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      pip-updates:
        applies-to: version-updates
        patterns:
          - "*"
