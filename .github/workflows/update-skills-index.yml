name: Update Skills Index

on:
  push:
    branches:
      - "main"
    paths:
      - "skills-config.json"
      - "skills-config.schema.json"
  # Run every day at midnight
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      install:
        description: "Sync skills into .agents/skills/ (true/false)"
        required: false
        default: "true"
      dry_run:
        description: "Preview changes without writing or committing (true/false)"
        required: false
        default: "false"

permissions: {}

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install npx skills CLI
        run: npm install -g skills@1.5.11

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install JSON schema validator
        run: python3 -m pip install check-jsonschema==0.34.0

      - name: Checkout skills repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate skills config
        run: check-jsonschema --schemafile skills-config.schema.json skills-config.json

      - name: Sync skills and update README index
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INSTALL: ${{ inputs.install || 'true' }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "$INSTALL" = "false" ]; then
            FLAGS="$FLAGS --no-install"
          fi
          python3 scripts/update_skills_index.py $FLAGS

      - name: Commit and push if anything changed
        # Skip on dry-run; also safe when inputs are empty (scheduled run)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          SKILLS_PAT: ${{ secrets.SKILLS_PAT }}
        run: |
          git config user.name  "sys-siv-oep"
          git config user.email "sys-siv-oep@intel.com"
          git remote set-url origin "https://x-access-token:${SKILLS_PAT}@github.com/${{ github.repository }}.git"

          git add README.md .agents/skills/ skills-lock.json

          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi

          git commit -m "chore: sync skills and update README index \
          Installed/updated selected skills from skills-config.json and rebuilt README."
          git push
