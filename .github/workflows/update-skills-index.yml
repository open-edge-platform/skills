name: Update Skills Index

on:
  push:
    branches:
      - 'main'
    paths:
      - 'skills-config.json'
  # Run every 4 hours
  schedule:
    - cron: '0 */4 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      install:
        description: 'Sync skills into .agents/skills/ (true/false)'
        required: false
        default: 'true'
      dry_run:
        description: 'Preview changes without writing or committing (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.SKILLS_PAT }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install npx skills CLI
        run: npm install -g skills@1.5.11

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Sync skills and update README index
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          INSTALL: ${{ inputs.install }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "$INSTALL" = "false" ]; then
            FLAGS="$FLAGS --no-install"
          fi
          python3 scripts/update_skills_index.py $FLAGS

      - name: Commit and push if anything changed
        # Skip on dry-run; also safe when inputs are empty (scheduled run)
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md .agents/skills/ skills-lock.json

          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi

          git commit -m "chore: sync skills and update README index \
          Installed/updated selected skills from skills-config.json and rebuilt README."
          git push

