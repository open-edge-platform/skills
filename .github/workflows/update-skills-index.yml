name: Update Skills Index

on:
  # Run every 4 hours
  schedule:
    - cron: '0 */4 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      install:
        description: 'Sync earmarked skills into .agents/skills/ (true/false)'
        required: false
        default: 'true'
      dry_run:
        description: 'Preview changes without writing or committing (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npx skills CLI
        run: npm install -g skills@1.5.11

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync skills and update README index
        env:
          # Required by `npx skills add/update` to clone from GitHub
          GITHUB_TOKEN: ${{ secrets.SKILLS_PAT }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ inputs.install }}" = "false" ]; then
            FLAGS="$FLAGS --no-install"
          fi
          python3 scripts/update_skills_index.py $FLAGS

      - name: Create pull request if anything changed
        # Skip on dry-run; also safe when inputs are empty (scheduled run)
        if: ${{ inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "chore: sync skills and update README index"
          branch: automation/update-skills-index
          delete-branch: true
          title: "chore: sync skills and update README index"
          body: |
            Automated update from the `update-skills-index` workflow.

            - sync installed skills from `skills-config.json`
            - rebuild the README skills index
          add-paths: |
            README.md
            .agents/skills/
            skills-lock.json
