name: Update Skills Index

on:
  push:
    branches:
      - "main"
      - "release-*"
    paths:
      - "skills-config.json"
      - "skills-config.schema.json"
  # Run every day at midnight
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      install:
        description: "Sync skills into .agents/skills/ (true/false)"
        required: false
        default: "true"
      dry_run:
        description: "Preview changes without writing or committing (true/false)"
        required: false
        default: "false"
      branch:
        description: "Branch of open-edge-platform/skills to verify with npx skills add"
        required: false
        default: "main"

permissions: {}

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # zizmor: ignore[cache-poisoning] -- caching explicitly disabled via cache: ""
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: ""

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install JSON schema validator
        run: python3 -m pip install -r requirements.txt

      - name: Validate skills config
        run: check-jsonschema --schemafile skills-config.schema.json skills-config.json

      - name: Sync skills and update README index
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INSTALL: ${{ inputs.install || 'true' }}
          NPM_CONFIG_YES: "true"
        run: |
          npm ci
          echo "Node.js version:"
          node --version
          echo "npx version:"
          npx --version
          echo "skills version:"
          npx skills --version
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "$INSTALL" = "false" ]; then
            FLAGS="$FLAGS --no-install"
          fi
          python3 scripts/update_skills_index.py $FLAGS

      - name: Commit and push if anything changed
        # Skip on dry-run; also safe when inputs are empty (scheduled run)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          SKILLS_PAT: ${{ secrets.SKILLS_PAT }}
        run: |
          git config user.name  "sys-siv-oep"
          git config user.email "sys-siv-oep@intel.com"
          git remote set-url origin "https://x-access-token:${SKILLS_PAT}@github.com/${{ github.repository }}.git"

          git add README.md .agents/skills/

          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi

          git commit -m "chore: sync skills and update README index \
          Installed/updated selected skills from skills-config.json and rebuilt README."
          git push

      - name: Verify skills installation
        env:
          VERIFY_BRANCH: ${{ inputs.branch || github.ref_name }}
          NPM_CONFIG_YES: "true"
        run: |
          REPO="open-edge-platform/skills"
          if [ "${VERIFY_BRANCH}" = "main" ]; then
            SOURCE="$REPO"
          else
            SOURCE="$REPO#${VERIFY_BRANCH}"
          fi
          npx skills add "$SOURCE" --list
          npx skills add "$SOURCE" --skill '*' --agent claude-code --agent github-copilot --agent codex --global --yes
