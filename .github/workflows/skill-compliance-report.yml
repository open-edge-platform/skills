name: Generate Skill Compliance Report

on:
  push:
    branches: ["main", "release-*"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # Daily at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check_paths.outputs.run }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - ".agents/skills/**"
              - ".github/workflows/skill-compliance-report.yml"
              - "scripts/generate_skill_compliance_report.py"

  run-validators:
    name: Run Skill Validators
    needs: check-paths
    if: needs.check-paths.outputs.run == 'true'
    uses: $/.github/workflows/skill-scan.yml
    permissions:
      contents: read
    with:
      severity: LOW

  bandit-scan:
    name: Run Bandit scan (repo-wide)
    needs: check-paths
    if: needs.check-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Bandit scan
        id: bandit
        uses: open-edge-platform/geti-ci/actions/bandit@b9abdfc0ecbe989816a7f2cf582af771f9abbb87 # bandit/v0.1.1
        with:
          artifact-name: compliance-bandit-results
          scan-scope: all
          paths: "."
          severity-level: LOW
          confidence-level: LOW
          output-format: json
          fail-on-findings: "false"
          upload-sarif: "false"

  zizmor-scan:
    name: Run Zizmor scan (repo-wide)
    needs: check-paths
    if: needs.check-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor scan
        id: zizmor
        uses: open-edge-platform/geti-ci/actions/zizmor@27a17d738348699840c32f98edc9947f21278154 # zizmor/v0.1.5
        with:
          scan-scope: all
          paths: "."
          severity-level: LOW
          confidence-level: LOW
          output-format: json
          fail-on-findings: "false"
          upload-sarif: "false"

  scorecard-fetch:
    name: Fetch OpenSSF Scorecard results
    needs: check-paths
    if: needs.check-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch scorecard results from OpenSSF public API
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            "https://api.securityscorecards.dev/projects/github.com/${GITHUB_REPOSITORY}" \
            -o scorecard-results.json || echo '{}' > scorecard-results.json
          cat scorecard-results.json

      - name: Upload scorecard results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-scorecard-results
          path: scorecard-results.json
          retention-days: 30

  parse-results:
    name: Parse Validator Results
    needs: [run-validators, bandit-scan, zizmor-scan, scorecard-fetch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download validator report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: skill-validator-report
          path: ./validator-report/

      - name: Download spector report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: skill-spector-report
          path: ./spector-report/

      - name: Download Bandit report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: compliance-bandit-results
          path: ./bandit-report/

      - name: Download Zizmor report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: zizmor-results
          path: ./zizmor-report/

      - name: Download Scorecard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: compliance-scorecard-results
          path: ./scorecard-report/

      - name: Parse validator report to JSON
        if: always()
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import re
          from pathlib import Path

          report_files = [f for f in Path('./validator-report').glob('**/*') if f.is_file()]
          if not report_files:
            print("Validator report not found")
            exit(0)

          content = report_files[0].read_text()

          validator_data = {}
          current_skill = None
          tokens_recorded = set()
          errors = 0
          warnings = 0

          for line in content.split('\n'):
            # Header: "## Validating skill: /path/.agents/skills/skill-name"
            m = re.match(r'^## Validating skill:\s+.+/\.agents/skills/([^/\s]+)', line)
            if m:
              current_skill = m.group(1).strip()
              validator_data[current_skill] = {'errors': 0, 'warnings': 0, 'tokens_used': 0, 'findings': []}
            elif current_skill:
              if re.match(r'^- \*\*Error:\*\*', line):
                errors += 1
                validator_data[current_skill]['errors'] += 1
                finding = re.sub(r'^- \*\*Error:\*\*\s*', '', line).strip()
                if finding:
                  validator_data[current_skill]['findings'].append(('error', finding))
              elif re.match(r'^- \*\*Warning:\*\*', line):
                warnings += 1
                validator_data[current_skill]['warnings'] += 1
                finding = re.sub(r'^- \*\*Warning:\*\*\s*', '', line).strip()
                if finding:
                  validator_data[current_skill]['findings'].append(('warning', finding))
              # First "| **Total** | **N,NNN** |" row = main skill tokens (SKILL.md + references)
              elif current_skill not in tokens_recorded:
                tok = re.search(r'\|\s*\*\*Total\*\*\s*\|\s*\*\*([0-9,]+)\*\*', line)
                if tok:
                  validator_data[current_skill]['tokens_used'] = int(tok.group(1).replace(',', ''))
                  tokens_recorded.add(current_skill)

          with open('validator_results.json', 'w') as f:
            json.dump({'total_errors': errors, 'total_warnings': warnings, 'skills': validator_data}, f, indent=2)

          print(f"Parsed validator results: {errors} errors, {warnings} warnings")
          PYTHON_EOF

      - name: Parse spector report to JSON
        if: always()
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import re
          from pathlib import Path

          report_files = [f for f in Path('./spector-report').glob('**/*') if f.is_file()]
          if not report_files:
            print("Spector report not found")
            exit(0)

          content = report_files[0].read_text()

          spector_data = {}
          current_skill = None

          for line in content.split('\n'):
            # Header: "Skill          : /path/.agents/skills/skill-name"
            m = re.match(r'^Skill\s*:\s*.+/\.agents/skills/([^/\s]+)', line)
            if m:
              current_skill = m.group(1).strip()
              spector_data[current_skill] = {
                'score': 0,
                'critical': 0,
                'high': 0,
                'medium': 0,
                'low': 0,
                'severity': '',
                'recommendation': '',
                'issues': 0,
              }
            elif current_skill:
              skill_level_score = re.match(r'^Score\s*:\s*(\d+)\s*/\s*\d+\s*$', line)
              if skill_level_score:
                spector_data[current_skill]['score'] = int(skill_level_score.group(1))
                continue

              skill_level_severity = re.match(r'^Severity\s*:\s*(CRITICAL|HIGH|MEDIUM|LOW)\b', line)
              if skill_level_severity:
                spector_data[current_skill]['severity'] = skill_level_severity.group(1).upper()
                continue

              skill_level_recommendation = re.match(r'^Recommendation\s*:\s*(.+?)\s*$', line)
              if skill_level_recommendation:
                spector_data[current_skill]['recommendation'] = skill_level_recommendation.group(1).strip()
                continue

              skill_level_issues = re.match(r'^Issues\s*:\s*(\d+)', line)
              if skill_level_issues:
                spector_data[current_skill]['issues'] = int(skill_level_issues.group(1))
                continue

              # Per-issue line (indented): "  Severity    : HIGH (confidence: 0.8)"
              sev = re.match(r'^\s+Severity\s*:\s*(CRITICAL|HIGH|MEDIUM|LOW)\b', line)
              if sev:
                severity_key = sev.group(1).lower()
                spector_data[current_skill][severity_key] += 1

          total_critical = sum(s['critical'] for s in spector_data.values())
          total_high = sum(s['high'] for s in spector_data.values())
          total_medium = sum(s['medium'] for s in spector_data.values())
          total_low = sum(s['low'] for s in spector_data.values())

          with open('spector_results.json', 'w') as f:
            json.dump({
              'total_critical': total_critical,
              'total_high': total_high,
              'total_medium': total_medium,
              'total_low': total_low,
              'skills': spector_data
            }, f, indent=2)

          print(f"Parsed spector results: {total_critical} critical, {total_high} high, {total_medium} medium, {total_low} low")
          PYTHON_EOF

      - name: Parse Bandit report to JSON
        if: always()
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import re
          from pathlib import Path

          report_files = [f for f in Path('./bandit-report').glob('**/*.json') if f.is_file()]
          if not report_files:
            print("Bandit report not found")
            with open('bandit_results.json', 'w') as f:
              json.dump({'available': False}, f, indent=2)
            exit(0)

          data = json.loads(report_files[0].read_text())
          results = data.get('results', [])

          skills_data = {}
          totals = {'high': 0, 'medium': 0, 'low': 0, 'undefined': 0}

          for issue in results:
            severity = str(issue.get('issue_severity', 'UNDEFINED')).lower()
            if severity not in totals:
              severity = 'undefined'
            totals[severity] += 1

            filename = issue.get('filename', '')
            m = re.search(r'\.agents/skills/([^/]+)/', filename)
            if m:
              skill_name = m.group(1)
              skill_entry = skills_data.setdefault(
                skill_name, {'high': 0, 'medium': 0, 'low': 0, 'issues': 0}
              )
              if severity in ('high', 'medium', 'low'):
                skill_entry[severity] += 1
              skill_entry['issues'] += 1

          with open('bandit_results.json', 'w') as f:
            json.dump({
              'available': True,
              'total_high': totals['high'],
              'total_medium': totals['medium'],
              'total_low': totals['low'],
              'total_issues': len(results),
              'skills': skills_data,
            }, f, indent=2)

          print(f"Parsed Bandit results: {len(results)} issues "
                f"({totals['high']} high, {totals['medium']} medium, {totals['low']} low)")
          PYTHON_EOF

      - name: Parse Zizmor report to JSON
        if: always()
        run: |
          python3 << 'PYTHON_EOF'
          import json
          from pathlib import Path

          report_files = [f for f in Path('./zizmor-report').glob('**/*.json') if f.is_file()]
          if not report_files:
            print("Zizmor report not found")
            with open('zizmor_results.json', 'w') as f:
              json.dump({'available': False}, f, indent=2)
            exit(0)

          findings = json.loads(report_files[0].read_text())
          if not isinstance(findings, list):
            findings = []

          totals = {'high': 0, 'medium': 0, 'low': 0, 'informational': 0, 'unknown': 0}
          for finding in findings:
            severity = str(finding.get('determinations', {}).get('severity', 'Unknown')).lower()
            if severity not in totals:
              severity = 'unknown'
            totals[severity] += 1

          with open('zizmor_results.json', 'w') as f:
            json.dump({
              'available': True,
              'total_issues': len(findings),
              'total_high': totals['high'],
              'total_medium': totals['medium'],
              'total_low': totals['low'],
              'total_informational': totals['informational'],
            }, f, indent=2)

          print(f"Parsed Zizmor results: {len(findings)} findings "
                f"({totals['high']} high, {totals['medium']} medium, {totals['low']} low)")
          PYTHON_EOF

      - name: Parse Scorecard report to JSON
        if: always()
        run: |
          python3 << 'PYTHON_EOF'
          import json
          from pathlib import Path

          report_files = [f for f in Path('./scorecard-report').glob('**/*.json') if f.is_file()]
          if not report_files:
            print("Scorecard report not found")
            with open('scorecard_results.json', 'w') as f:
              json.dump({'available': False}, f, indent=2)
            exit(0)

          try:
            data = json.loads(report_files[0].read_text())
          except json.JSONDecodeError:
            data = {}

          if not data or 'score' not in data:
            with open('scorecard_results.json', 'w') as f:
              json.dump({'available': False}, f, indent=2)
            print("Scorecard data unavailable or incomplete")
            exit(0)

          checks = [
            {
              'name': c.get('name', ''),
              'score': c.get('score', -1),
              'reason': c.get('reason', ''),
            }
            for c in data.get('checks', [])
          ]

          with open('scorecard_results.json', 'w') as f:
            json.dump({
              'available': True,
              'score': data.get('score', -1),
              'date': data.get('date', ''),
              'repo': data.get('repo', {}).get('name', ''),
              'checks': checks,
            }, f, indent=2)

          print(f"Parsed Scorecard results: overall score {data.get('score', -1)}")
          PYTHON_EOF

      - name: Upload validator JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validator-json
          path: validator_results.json
          retention-days: 30

      - name: Upload spector JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spector-json
          path: spector_results.json
          retention-days: 30

      - name: Upload Bandit JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-json
          path: bandit_results.json
          retention-days: 30

      - name: Upload Zizmor JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zizmor-json
          path: zizmor_results.json
          retention-days: 30

      - name: Upload Scorecard JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-json
          path: scorecard_results.json
          retention-days: 30

  generate-compliance-report:
    name: Generate Skill Compliance Report
    needs: parse-results
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validator JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: validator-json
          path: ./

      - name: Download spector JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: spector-json
          path: ./

      - name: Download Bandit JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: bandit-json
          path: ./

      - name: Download Zizmor JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: zizmor-json
          path: ./

      - name: Download Scorecard JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: scorecard-json
          path: ./

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown pyyaml

      - name: Generate Skill Compliance Report
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/generate_skill_compliance_report.py

      - name: Publish report to job summary
        if: always()
        run: cat skill-compliance-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Report Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: skill-compliance-report
          path: skill_summary_output.html
          retention-days: 30

      - name: Update tracking issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid GITHUB_RUN_ID"
            exit 1
          fi
          if ! [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid GITHUB_REPOSITORY"
            exit 1
          fi
          if ! [[ "$GITHUB_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::Invalid GITHUB_SERVER_URL"
            exit 1
          fi
          ISSUE_TITLE="Skill Compliance Report - Scheduled Summary"
          issue_body_file="$(mktemp)"
          trap 'rm -f "$issue_body_file"' EXIT

          # Prepend run metadata to the generated report
          {
            echo ""
            echo "Last updated: $(date -u '+%Y-%m-%d %H:%M UTC') ([run #${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))"
            echo ""
            cat skill-compliance-report.md
          } > "$issue_body_file"

          # Find existing issue (open or closed) by exact title
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --search "in:title ${ISSUE_TITLE}" \
            --state all \
            --json number,title \
            | jq --arg title "$ISSUE_TITLE" -r \
                '.[] | select(.title == $title) | .number' \
            | head -n 1)

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$issue_body_file"
            gh issue reopen "$issue_number" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            echo "Updated issue #${issue_number}"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file "$issue_body_file"
            echo "Created new issue"
          fi

      - name: Display Report Summary
        run: |
          echo "✅ Skill Compliance Report generated successfully"
          echo "📄 Location: skill_summary_output.html"
          echo "📊 Report includes:"
          echo "  - Component summary"
          echo "  - Skill evaluation metrics"
          echo "  - Benchmark data"
          echo "  - Validator and security scan results"

  required-check:
    name: Required Check Skill Compliance Report
    needs:
      - check-paths
      - run-validators
      - bandit-scan
      - zizmor-scan
      - scorecard-fetch
      - parse-results
      - generate-compliance-report
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error ::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
