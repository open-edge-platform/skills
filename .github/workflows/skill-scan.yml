name: Skill Scanner

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".github/workflows/skill-scan.yml"
  push:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      severity:
        description: "SkillSpector severity level (CRITICAL, HIGH, MEDIUM, LOW)"
        required: false
        default: "LOW"
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW

permissions: {}

jobs:
  SkillSpector-scan:
    name: SkillSpector security scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true # FIXME use false once repo make public
          fetch-depth: 0

      - name: Run SkillSpector scan
        uses: open-edge-platform/geti-ci/actions/skill-scan@78e175e3e91f997e168a09aadd1933da95c1ac98 # skill-scan/v0.1.0
        with:
          skills-path: .agents/skills/
          severity-level: ${{ github.event_name == 'pull_request' && 'HIGH' || github.event.inputs.severity || 'LOW' }}
          fail-on-findings: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

  skill-validator-scan:
    name: skill-validator scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true # FIXME use false once repo make public
          fetch-depth: 0

      - name: Run skill-validator
        uses: open-edge-platform/geti-ci/actions/skill-validator@ac8d35f5bb94a135ec778498cf5082bc70babffe # skill-validator/v0.1.0
        with:
          skills-path: .agents/skills/
          strict: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          fail-on-findings: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
