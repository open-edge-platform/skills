name: Check Skills Config

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "skills-config.json"
      - "skills-config.schema.json"
      - "scripts/update_skills_index.py"
      - ".github/workflows/check-skills-config.yml"

permissions: {}

jobs:
  check-skills:
    name: Check configured skills
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install JSON schema validator
        run: python3 -m pip install check-jsonschema==0.34.0

      - name: Validate skills config
        run: check-jsonschema --schemafile skills-config.schema.json skills-config.json

      - name: Read base skills config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "${BASE_SHA}:skills-config.json" > "${RUNNER_TEMP}/skills-config.base.json"

      - name: Check added skills exist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/update_skills_index.py
          --check-only
          --base-config "${RUNNER_TEMP}/skills-config.base.json"