name: Check Skills Config

on:
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check_paths.outputs.run }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - "skills-config.json"
              - "skills-config.yaml"
              - "skills-config.schema.json"
              - "scripts/skills_config.py"
              - "scripts/update_skills_index.py"
              - "scripts/generate_skill_compliance_report.py"
              - "requirements.txt"
              - "tests/**"
              - ".github/workflows/check-skills-config.yml"

  check-skills:
    name: Check configured skills
    needs: check-paths
    if: needs.check-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install catalog dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate skills config
        run: |
          check-jsonschema --schemafile skills-config.schema.json skills-config.yaml
          python3 scripts/skills_config.py

      - name: Test catalog migration and consumers
        run: python3 -m unittest discover -s tests -v

      - name: Read base skills config
        id: base-config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid BASE_SHA"
            exit 1
          fi
          yaml_exists=false
          json_exists=false
          if git cat-file -e "${BASE_SHA}:skills-config.yaml" 2>/dev/null; then yaml_exists=true; fi
          if git cat-file -e "${BASE_SHA}:skills-config.json" 2>/dev/null; then json_exists=true; fi
          if [[ "$yaml_exists" == true && "$json_exists" == true ]]; then
            echo "::error::Base commit contains both YAML and JSON catalogs"
            exit 1
          elif [[ "$yaml_exists" == true ]]; then
            extension=yaml
          elif [[ "$json_exists" == true ]]; then
            extension=json
          else
            echo "::error::Base commit has no skills catalog"
            exit 1
          fi
          base_config="${RUNNER_TEMP}/skills-config.base.${extension}"
          git show "${BASE_SHA}:skills-config.${extension}" > "$base_config"
          echo "path=$base_config" >> "$GITHUB_OUTPUT"

      - name: Check added skills exist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_CONFIG: ${{ steps.base-config.outputs.path }}
        run: >-
          python3 scripts/update_skills_index.py
          --check-only
          --base-config "$BASE_CONFIG"

  required-check:
    name: Required Check Skills Config
    needs:
      - check-paths
      - check-skills
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error ::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
